<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十座位复刻练习</title>
<style>body{max-width:1050px;margin:25px auto;padding:20px;background:#f5f4ed;color:#263f34;font:16px/1.7 Microsoft YaHei}button,textarea{font:inherit}button{padding:8px 14px;border:1px solid #a6bba7;background:white;border-radius:5px;cursor:pointer}textarea{width:100%;height:70px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:white;padding:18px;border-radius:8px}svg{width:100%;height:420px;background:#e6ebde}#results{display:flex;gap:8px;flex-wrap:wrap}#viewport{height:420px}small{color:#6d7d70}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<h1>十座位复刻练习</h1><p>从小数组理解主项目。全部为合成练习数据，不是馆内状态。</p>
<div id="flat"><div class="grid"><article><h2>表达与确认</h2><textarea id="demand" placeholder="例如：我想靠窗"></textarea><p><button id="parse">解析文字</button> <button id="apply" disabled>确认条件</button></p><p id="preview">先输入再解析。</p><p><label><input type="checkbox" id="window">临窗偏好</label></p><button id="generate">生成四优先</button><h2>比较候选</h2><div id="results"></div><p id="detail"></p><button id="open3d">在练习三维中查看</button></article><article><h2>同源单层图</h2><p><button id="reset">查看整层</button></p><svg id="map" aria-label="十座位示意图"></svg><small>红：有人；绿：离座；灰：待核对；棕：专座；金：候选。</small></article></div></div>
<article id="three" hidden><button id="back">返回刚才的选择</button><p>蓝色方块只是最小椅位几何；完整馆舍在主项目。</p><div id="viewport"></div></article>
