<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嘉庚知座 · 建筑与五层展示</title>
<style>body{margin:0;background:#f5f3ec;color:#263e37;font:15px 'Microsoft YaHei',sans-serif}header,footer{padding:18px 24px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.8}button{background:white;color:#25493d;border:1px solid #b5c4b7;border-radius:7px;padding:9px;margin:3px;cursor:pointer}button.active{background:#285e50;color:white}#viewport{height:62vh;min-height:400px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;padding:4px 7px;background:#fffc;color:#1d382c;border:1px solid #647c69;border-radius:4px;font-size:12px;white-space:nowrap;transform:translate(-50%,-50%)}label{display:inline-block;margin:6px}#modelError{color:#8b463d}footer small{display:block}button:focus-visible{outline:3px solid #c48d32}</style>
<header><h1>嘉庚知座 · 建筑与五层空间预览</h1><div><button id="campus">主一至主五</button><button id="rear">主三背面与湖畔</button><button id="cut">空间剖切</button><button id="top">平面俯瞰</button></div><div><button data-floor="0">全部楼层</button><button data-floor="1">1F</button><button data-floor="2">2F</button><button data-floor="3">3F</button><button data-floor="4">4F</button><button data-floor="5">5F</button></div><label><input id="expand" type="checkbox">五层展开</label><label><input id="furniture" type="checkbox" checked>家具示意（关闭看骨架）</label><label><input id="labelToggle" type="checkbox" checked>分区文字</label><button id="resetView">重置视角</button><button id="snapshot">保存当前效果图</button></header>
<div id="viewport"><div id="labels"></div></div><footer><strong id="floorTitle"></strong><p id="floorSummary"></p><p id="floorText"></p><p id="modelError" role="alert"></p><p id="viewStatus" aria-live="polite"></p><small>建筑意象及相对分区示意，非工程测绘、当前家具坐标或真实导航地图。选座Demo中的60个座位为独立测试数据。</small><small>拖动旋转，滚轮缩放；从楼群点击主三进入背面，再点击馆舍进入五层剖切。馆藏调整时以官方目录与现场标识为准。</small></footer><script>/*__BUNDLE__*/</script></html>
